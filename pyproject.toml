[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "low-key"
version = "0.2.0"
description = "Low Key: a calm way to buy a car. Python side: the data pipeline and preflight checks behind the app (lowkey/), plus the headless Muse Glimmer decision trunk (headless-glimmer/)."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Dylan Goldblatt" }]
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
model = ["torch>=2.2", "safetensors", "huggingface_hub"]
hf = ["transformers>=4.45", "peft"]
dev = ["pytest>=8", "ruff>=0.5"]

[tool.setuptools.packages.find]
where = ["headless-glimmer"]
include = ["headless_glimmer*"]

[tool.ruff]
line-length = 110
src = [".", "headless-glimmer"]
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501", "B905"]

[tool.pytest.ini_options]
testpaths = ["lowkey/pipeline", "lowkey/preflight", "headless-glimmer/tests", "cloud/quote_reader/tests"]
pythonpath = ["headless-glimmer"]
addopts = "--import-mode=importlib"
