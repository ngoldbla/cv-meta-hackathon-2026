notes: An 11-car train is a 5-car and a 6-car set, each with an A (cab) car at both ends, so 4 A cars and 7 B/C cars (an assumption about set make-up). Whether the published figures are guideline or crush loads is not stated; W2 lowers the usable share for uneven car loading.
